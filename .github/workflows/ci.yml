name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml targets static musl through rust-lld with zig cc as the host linker,
  # because the machine this was written on has no C compiler and cannot be given one. A CI
  # runner has cc and no musl target, so both settings are overridden back to the defaults
  # here. Environment variables beat the config file, which is what makes this work.
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Installed explicitly rather than relying on the runner image happening to ship it,
      # which is how CI breaks quietly six months later.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Show ffmpeg version
        run: ffmpeg -version | head -1 && ffprobe -version | head -1

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
