name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl, so the Linux binary needs nothing on the target machine at all.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: asciiplay-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: asciiplay-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: asciiplay-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/asciiplay" "dist/${{ matrix.name }}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          else
            shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find artifacts -type f -print
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "asciiplay $TAG" \
            --generate-notes \
            $(find artifacts -type f | tr '\n' ' ')
