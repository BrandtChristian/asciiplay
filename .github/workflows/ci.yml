name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Installed explicitly rather than relying on the runner image happening to ship it,
      # which is how CI breaks quietly six months later.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Show ffmpeg version
        run: ffmpeg -version | head -1 && ffprobe -version | head -1

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The e2e suite shells out to ffprobe and ffmpeg to prove an exported MP4 really carries
      # audio rather than a silent track. The check job above installs ffmpeg for its own
      # reasons; this job needs it independently, and without it spawnSync returns undefined
      # streams and the failure reads as an unrelated TypeError.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Show ffprobe version
        run: ffprobe -version | head -1

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

      # The browser is the only place the renderer can actually be exercised, so the end to end
      # pass is not optional here: unit tests cover the maths and cannot see a canvas.
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
